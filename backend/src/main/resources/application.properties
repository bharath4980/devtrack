spring.application.name=devtrack
spring.config.import=optional:file:../.env[.properties]

spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/devtrack}
spring.datasource.username=${DATABASE_USER:devtrack}
spring.datasource.password=${POSTGRES_PASSWORD}

server.address=127.0.0.1
server.port=8080

management.endpoints.web.base-path=/api
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.flyway.baseline-on-migrate=${FLYWAY_BASELINE_ON_MIGRATE:false}
spring.flyway.baseline-version=1

server.servlet.session.timeout=30m
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.secure=${SESSION_COOKIE_SECURE:false}
server.servlet.session.tracking-modes=cookie
