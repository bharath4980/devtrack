name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend tests (H2)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Run backend tests
        working-directory: backend
        run: mvn --batch-mode clean test

  production:
    name: PostgreSQL and production browser tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: devtrack_test
          POSTGRES_USER: devtrack
          POSTGRES_PASSWORD: test-only-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U devtrack -d devtrack_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Test against PostgreSQL
        working-directory: backend
        env:
          TEST_DATABASE_URL: jdbc:postgresql://localhost:5432/devtrack_test
          TEST_DATABASE_DRIVER: org.postgresql.Driver
          TEST_DATABASE_USER: devtrack
          TEST_DATABASE_PASSWORD: test-only-password
        run: mvn --batch-mode clean test
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Check frontend types and build
        working-directory: frontend
        run: npm run build
      - name: Build production image
        run: docker build -t devtrack:test .
      - name: Start production image against disposable database
        run: |
          docker run -d --name devtrack-test --network host \
            -e DATABASE_URL=jdbc:postgresql://127.0.0.1:5432/devtrack_test \
            -e DATABASE_USER=devtrack -e POSTGRES_PASSWORD=test-only-password \
            -e SERVER_ADDRESS=127.0.0.1 -e PORT=8081 -e SESSION_COOKIE_SECURE=false \
            devtrack:test
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:8081/api/health; then exit 0; fi
            sleep 2
          done
          docker logs devtrack-test
          exit 1
      - name: Install Chromium
        working-directory: frontend
        run: npx playwright install --with-deps chromium
      - name: Run desktop and mobile browser workflows
        working-directory: frontend
        run: npm run test:e2e
      - name: Show application logs on failure
        if: failure()
        run: docker logs devtrack-test || true
      - name: Upload browser test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-test-results
          path: |
            frontend/test-results/
            frontend/playwright-report/
          retention-days: 7
