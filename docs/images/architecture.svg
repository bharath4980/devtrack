<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc"><title id="title">DevTrack production architecture</title><desc id="desc">Browser React and TypeScript, Spring Boot with security, owner-scoped services and JPA, PostgreSQL, and a separate CI to Render delivery pipeline.</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M1 1 L7 4 L1 7" fill="none" stroke="#51856C" stroke-width="1.8"/></marker></defs><rect x="0" y="0" width="1200" height="620" rx="15" fill="#F4F7F4" stroke="none"/><text x="48" y="57" font-family="Inter,system-ui,Arial,sans-serif" font-size="31" font-weight="700" fill="#193B34" text-anchor="start">DevTrack | architecture</text><text x="48" y="89" font-family="Inter,system-ui,Arial,sans-serif" font-size="15" font-weight="500" fill="#63756B" text-anchor="start">Same-origin application and deliberate verification boundaries</text><rect x="48" y="130" width="248" height="273" rx="15" fill="#FFFFFF" stroke="#D5E1D9"/><text x="70" y="167" font-family="Inter,system-ui,Arial,sans-serif" font-size="16" font-weight="600" fill="#73827A" text-anchor="start">Client</text><rect x="70" y="189" width="202" height="148" rx="15" fill="#EAF2EC" stroke="none"/><text x="89" y="227" font-family="Inter,system-ui,Arial,sans-serif" font-size="21" font-weight="700" fill="#20483D" text-anchor="start">React + TypeScript</text><text x="89" y="258" font-family="Inter,system-ui,Arial,sans-serif" font-size="14" font-weight="500" fill="#233C35" text-anchor="start">Browser workspace</text><text x="89" y="287" font-family="Inter,system-ui,Arial,sans-serif" font-size="13" font-weight="500" fill="#61746A" text-anchor="start">Session cookie + CSRF</text><text x="70" y="377" font-family="Inter,system-ui,Arial,sans-serif" font-size="14" font-weight="500" fill="#496B5A" text-anchor="start">HTTPS / same-origin /api</text><rect x="340" y="130" width="540" height=